services:
  app:
    container_name: anasty-rss-mhjoybots-fuse-app-1
    build:
      context: .
      dockerfile: Dockerfile
    command: bash start.sh
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config.py:/app/config.py
      - ./tdlib_user:/app/tdlib_user
      - ./tdlib_user_2:/app/tdlib_user_2
      - ./tdlib_user_3:/app/tdlib_user_3
      - ./tdlib_user_4:/app/tdlib_user_4
      - ./tdlib_user_5:/app/tdlib_user_5
      - ./tdlib_user_6:/app/tdlib_user_6
      - ./tdlib_user_6_2:/app/tdlib_user_6_2
      - ./tdlib_user_7:/app/tdlib_user_7
      - ./tdlib_user_8:/app/tdlib_user_8
      - ./tdlib_user_9:/app/tdlib_user_9
      - ./tdlib_user_10:/app/tdlib_user_10
      - ./tdlib_user_11:/app/tdlib_user_11
      - /srv/bot-storage/fuse_bot/downloads:/app/downloads
      - /srv/bot-storage/fuse_bot/accounts:/app/accounts
      - /srv/bot-storage/fuse_bot/thumbnails:/app/thumbnails
      - /srv/bot-storage/fuse_bot/tokens:/app/tokens
      - /srv/bot-storage/fuse_bot/rclone:/app/rclone
      - /srv/bot-storage/fuse_bot/qBittorrent:/app/qBittorrent
      - /srv/bot-storage/fuse_bot/sabnzbd:/app/sabnzbd
      - /srv/bot-storage/fuse_bot/token.pickle:/app/token.pickle
      - /srv/bot-storage/fuse_bot/credentials.json:/app/credentials.json
      - /srv/bot-storage/fuse_bot/cookies.txt:/app/cookies.txt
      - /srv/bot-storage/fuse_bot/.netrc:/app/.netrc
